name: Build and Release GRASS for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - v1.4.0
      - v1.4.1
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: grass-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          package-manager-cache: false

      - name: Set version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Invalid release tag: $tag. Expected vMAJOR.MINOR.PATCH"
          }
          $version = $tag.Substring(1)
          npm version $version --no-git-tag-version --allow-same-version
          Write-Host "Release version: $version"

      - name: Show versions
        shell: pwsh
        run: |
          node --version
          npm --version
          $pkg = Get-Content 'package.json' -Raw | ConvertFrom-Json
          Write-Host "GRASS version: $($pkg.version)"
          if ('${{ github.ref_type }}' -eq 'tag') {
            $expected = '${{ github.ref_name }}'.Substring(1)
            if ($pkg.version -ne $expected) { throw "package.json version $($pkg.version) does not match tag $expected" }
          }

      - name: Install dependencies
        run: npm install

      - name: Validate project files
        shell: pwsh
        run: |
          node --check main.js
          node --check preload.js
          if (-not (Test-Path 'index.html')) { throw 'index.html not found' }
          if (-not (Test-Path 'GRASS_icon.ico')) { throw 'GRASS_icon.ico not found' }
          if (-not (Test-Path 'package.json')) { throw 'package.json not found' }

      - name: Build NSIS installer
        run: npm run dist:win

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path 'dist' -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'Installer .exe was not created' }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size: $([math]::Round($installer.Length / 1MB, 2)) MB"

      - name: Calculate SHA256
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path 'dist' -Filter '*.exe' | Select-Object -First 1
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash
          "$hash  $($installer.Name)" | Out-File -Encoding ascii 'dist/SHA256SUMS.txt'
          Write-Host "SHA256: $hash"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: GRASS-Windows-Installer-${{ github.ref_type == 'tag' && github.ref_name || github.run_number }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/v1.4.0' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: GRASS — Передача смены ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
